name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-dummy-secret
          ENCRYPTION_KEY: 7_uWKh74qNCfi8Xkd2AAoHjPQcbUd-y829bdxKJosRE=
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          GOOGLE_REDIRECT_URI: http://localhost:8000/api/google/callback
        run: |
          uv sync --frozen
          uv run pytest
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .
      - name: Lint + typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run type-check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract branch + sha
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME#refs/heads/}"
          SHA12="${GITHUB_SHA::12}"
          echo "suffix=${BRANCH}-${SHA12}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            andrewallkin/docsmith:backend-${{ steps.meta.outputs.suffix }}
            andrewallkin/docsmith:backend-${{ github.ref_name }}-latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            andrewallkin/docsmith:frontend-${{ steps.meta.outputs.suffix }}
            andrewallkin/docsmith:frontend-${{ github.ref_name }}-latest
